# clamd for the upload pipeline (U14, KTD22). Mounted over /etc/clamav/clamd.conf of the pinned
# clamav/clamav image; the integration tests run this exact file (apps/api/test/support/clamd.ts).
#
# The API streams each quarantined file with INSTREAM over the region's private network, so the
# TCP socket is never published. Limits are deliberately small: the largest upload is 20 MiB,
# and clamd's PDF parser bug CVE-2025-20260 is reachable only with limits above 1 GB. The
# scanner fails closed: with AlertExceedsMax, content beyond any limit is reported as
# Heuristics.Limits.Exceeded.* and the file is flagged, never passed as clean.

LogTime yes
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 10M
LogRotate yes
LogClean no
DatabaseDirectory /var/lib/clamav
SelfCheck 600
User clamav

# The image's start script waits for the local socket; the API connects over TCP.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

MaxConnectionQueueLength 30
MaxThreads 4
MaxQueue 100
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 30

# Scan limits: small, and alerting when exceeded.
StreamMaxLength 25M
MaxScanTime 60000
MaxScanSize 100M
MaxFileSize 50M
MaxRecursion 10
MaxFiles 2000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 25M
AlertExceedsMax yes

# What a file may not hide: encrypted content cannot be scanned, and macros are active content.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
AlertBrokenExecutables yes
AlertPartitionIntersection yes
HeuristicAlerts yes

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes
ScanHTML yes
ScanArchive yes
ScanMail yes
Bytecode yes
